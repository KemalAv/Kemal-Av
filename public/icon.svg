<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="polyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="12" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="6" />

  <!-- Abstract Interconnected Roadmap Nodes (Representing multi-app space) -->
  <g filter="url(#glow)">
    <!-- Path lines -->
    <path d="M 170,170 L 256,120 L 342,170 L 342,270 L 256,320 L 170,270 Z" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="6" stroke-dasharray="10, 5" />
    <path d="M 256,120 L 256,390" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="8" />
    <path d="M 170,270 L 342,270" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="6" />
    
    <!-- Central letter "K" inside a shield/hexagon -->
    <polygon points="256,70 390,148 390,302 256,380 122,302 122,148" fill="url(#polyGrad)" />
    
    <!-- Styled tech letter "K" -->
    <path d="M 210,140 L 210,310 M 210,225 L 290,140 M 245,200 L 295,310" fill="none" stroke="#1e3a8a" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Nodes -->
    <circle cx="256" cy="70" r="14" fill="#06b6d4" stroke="#ffffff" stroke-width="4" />
    <circle cx="390" cy="148" r="14" fill="#3b82f6" stroke="#ffffff" stroke-width="4" />
    <circle cx="390" cy="302" r="14" fill="#06b6d4" stroke="#ffffff" stroke-width="4" />
    <circle cx="256" cy="380" r="14" fill="#3b82f6" stroke="#ffffff" stroke-width="4" />
    <circle cx="122" cy="302" r="14" fill="#06b6d4" stroke="#ffffff" stroke-width="4" />
    <circle cx="122" cy="148" r="14" fill="#3b82f6" stroke="#ffffff" stroke-width="4" />
  </g>
</svg>
